# Reverse proxy for the AgenticRAG stack (mounted as conf.d/default.conf).
#
# Single entry point on port 8080 inside the container:
#   /            -> ui:8501   Streamlit, including its WebSocket
#   /api/        -> api:8000  REST API, for the browser-based Next.js frontend
#   /health/     -> api:8000  API liveness and readiness
#   /healthz     -> 200       proxy liveness for the container health check
#
# The application has no sign-in yet, so every route except /healthz requires
# HTTP Basic Auth. Credentials come from infra/proxy/htpasswd (not in Git),
# created with infra/scripts/create-htpasswd.sh.

# ---------------------------------------------------------------------------
# Upstream resolution
# Docker's embedded DNS. Resolving at request time (variables in proxy_pass)
# instead of once at start-up keeps the proxy working after an upstream
# container is recreated with a new IP address.
# ---------------------------------------------------------------------------
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade: send "Connection: upgrade" only when the client asks for it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    set $ui_upstream  http://ui:8501;
    set $api_upstream http://api:8000;

    # Upload batches are limited to 100 MiB by the API; leave room for
    # multipart overhead. Larger requests fail here with 413.
    client_max_body_size 110m;

    # Basic hardening for a page served without TLS on a private network.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    auth_basic           "AgenticRAG";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # Headers every upstream receives.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -----------------------------------------------------------------------
    # Proxy health check (no auth, no upstream).
    # -----------------------------------------------------------------------
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # API. Answer generation can take minutes, so the read timeout is longer
    # than the 180 s client timeout used by the UI.
    # Do not let the browser credentials leak to the backend.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Authorization "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;  # stream uploads instead of spooling to disk
    }

    location /health/ {
        proxy_pass $api_upstream;
        proxy_set_header Authorization "";
    }

    # -----------------------------------------------------------------------
    # Streamlit. The app runs over one long-lived WebSocket (/_stcore/stream);
    # an idle timeout shorter than a user's pause would drop the session.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass $ui_upstream;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
